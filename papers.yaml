  - name: ita_mdt
    title:
      name: 'ITA-MDT: Image-Timestep-Adaptive Masked Diffusion Transformer Framework for Image-Based Virtual Try-On'
      link: 'https://arxiv.org/abs/2503.20418'
    authors:
      - name: Jiwoo Hong
        href: 'https://jiwoohong93.github.io/'
      - me: true
      - name: Trung X. Pham
        href: 'https://trungpx.github.io/'
        star: false
      - name: Gwanhyeong Koo
        href: 'https://kookie12.github.io/'
        star: false
      - name: Sunjae Yoon
        href: 'https://dbstjswo505.github.io/'
        star: false
      - name: Chang D. Yoo
        href: 'https://sanctusfactory.com/family.php'
        star: false
    conference:
      name: 'Conference on Computer Vision and Pattern Recognition (CVPR), 2025'
    description: >-
      This paper introduces ITA-MDT, the Image-Timestep-Adaptive Masked Diffusion Transformer Framework for Image-Based Virtual Try-On (IVTON), 
      designed to overcome the limitations of previous approaches by leveraging the Masked Diffusion Transformer (MDT) 
      for improved handling of both global garment context and fine-grained details. The IVTON task involves seamlessly 
      superimposing a garment from one image onto a person in another, creating a realistic depiction of the person wearing 
      the specified garment. Unlike conventional diffusion-based virtual try-on models that depend on large pre-trained U-Net architectures, 
      ITA-MDT leverages a lightweight, scalable transformer-based denoising diffusion model with a mask latent modeling scheme, 
      achieving competitive results while reducing computational overhead. A key component of ITA-MDT is the Image-Timestep 
      Adaptive Feature Aggregator (ITAFA), a dynamic feature aggregator that combines all of the features from the image encoder 
      into a unified feature of the same size, guided by diffusion timestep and garment image complexity. This enables adaptive 
      weighting of features, allowing the model to emphasize either global information or fine-grained details based on the requirements 
      of the denoising stage. Additionally, the Salient Region Extractor (SRE) module is presented to identify complex region of the garment 
      to provide high-resolution local information to the denoising model as an additional condition alongside the global 
      information of the full garment image. This targeted conditioning strategy enhances detail preservation of fine details 
      in highly salient garment regions, optimizing computational resources by avoiding unnecessarily processing entire garment image. 
    links:
      - name: arXiv
        href: 'https://arxiv.org/abs/2503.20418'
      - name: website
        href: 'https://jiwoohong93.github.io/ita-mdt/'
      - name: code
        href: 'https://github.com/jiwoohong93/ita-mdt_code'
    img2: false
    nogif: true
    highlighted: false
