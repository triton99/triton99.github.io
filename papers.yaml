  - name: taro
    title:
      name: 'TARO: Timestep-Adaptive Representation Alignment with Onset-Aware Conditioning for Synchronized Video-to-Audio Synthesis'
      link: 'https://www.arxiv.org/abs/2504.05684'
    authors:
      - me: true
      - name: Jiwoo Hong
        href: 'https://jiwoohong93.github.io/'
      - name: Chang D. Yoo
        href: 'https://sanctusfactory.com/family.php'
        star: false
    conference:
      name: 'International Conference on Computer Vision (ICCV), 2025'
    description: >-
      This paper introduces Timestep-Adaptive Representation Alignment with Onset-Aware Conditioning (TARO), a novel 
      framework for high-fidelity and temporally coherent video-to-audio synthesis. Built upon flow-based transformers, 
      which offer stable training and continuous transformations for enhanced synchronization and audio quality, 
      TARO introduces two key innovations: (1) Timestep-Adaptive Representation Alignment (TRA), which dynamically aligns 
      latent representations by adjusting alignment strength based on the noise schedule, ensuring smooth evolution and 
      improved fidelity, and (2) Onset-Aware Conditioning (OAC), which integrates onset cues that serve as sharp event-driven 
      markers of audio-relevant visual moments to enhance synchronization with dynamic visual events.
    links:
      - name: arXiv
        href: 'https://www.arxiv.org/abs/2504.05684'
      - name: website
        href: 'https://triton99.github.io/taro-site/'
      - name: code
        href: 'https://github.com/triton99/TARO'
    img2: false
    nogif: true
    highlighted: true
