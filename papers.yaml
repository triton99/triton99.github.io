  - name: dualpath
    title:
      name: 'Zero-Shot Dual-Path Integration Framework for Open-Vocabulary 3D Instance Segmentation'
      link: 'https://arxiv.org/abs/2408.08591'
    authors:
      - me: true
        star: true
      - name: Jiwoo Hong
        href: 'https://jiwoohong93.github.io/'
        star: true
      - name: SooHwan Eom
        href: 'https://scholar.google.com/citations?user=i8hb2bUAAAAJ&hl=ko'
        star: false
      - name: Jun Yeop Shim
        href: 'https://sanctusfactory.com/family_02.php'
        star: false
      - name: Junyeong Kim
        href: 'https://sites.google.com/view/imr-lab/family?authuser=0'
        star: false
      - name: Chang D. Yoo
        href: 'https://sanctusfactory.com/family.php'
        star: false
    conference:
      name: 'Conference on Computer Vision and Pattern Recognition Workshop (CVPR-W), 2024'
    description: >-
      This paper introduces Zero-Shot Dual-Path 
      Integration Framework that equally values the contributions of both 3D and 2D modalities. Our framework comprises three 
      components: 3D pathway, 2D pathway, and Dual-Path Integration. 3D pathway generates spatially accurate class-agnostic mask 
      proposals of common indoor objects from 3D point cloud data using a pre-trained 3D model, while 2D pathway utilizes pre-trained 
      open-vocabulary instance segmentation model to identify a diverse array of object proposals from multi-view RGB-D images. 
      In Dual-Path Integration, our Conditional Integration process, which operates in two stages, filters and merges the proposals 
      from both pathways adaptively. This process harmonizes output proposals to enhance segmentation capabilities. Our framework, 
      utilizing pre-trained models in a zero-shot manner, is model-agnostic and demonstrates superior performance on both seen and 
      unseen data.
    links:
      - name: arXiv
        href: 'https://arxiv.org/abs/2408.08591'
    img2: false
    nogif: true
    highlighted: true
