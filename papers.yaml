  - name: mdsgen
    title:
      name: 'MDSGen: Fast and Efficient Masked Diffusion Temporal-Aware Transformers for Open-Domain Sound Generation'
      link: 'https://arxiv.org/abs/2410.02130'
    authors:
      - name: Trung X. Pham
        href: 'https://trungpx.github.io/'
        star: true
      - me: true
        star: true
      - name: Chang D. Yoo
        href: 'https://sanctusfactory.com/family.php'
        star: false
    conference:
      name: 'International Conference on Learning Representations (ICLR), 2025'
    description: >-
      We introduce MDSGen, a novel framework for vision-guided open-domain sound generation optimized for model parameter size, 
      memory consumption, and inference speed. This framework incorporates two key innovations: (1) a redundant video feature 
      removal module that filters out unnecessary visual information, and (2) a temporal-aware masking strategy that leverages 
      temporal context for enhanced audio generation accuracy. In contrast to existing resource-heavy Unet-based models, MDSGen 
      employs denoising masked diffusion transformers, facilitating efficient generation without reliance on pre-trained diffusion models. 
    links:
      - name: arXiv
        href: 'https://arxiv.org/abs/2410.02130'
      - name: website
        href: 'https://triton99.github.io/mdsgen-site/'
      - name: code
        href: 'https://github.com/triton99/MDSGen'
    img2: false
    nogif: true
    highlighted: true
